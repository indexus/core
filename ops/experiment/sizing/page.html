<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Indexus — dimensionnement des machines et vnodes</title>
  <style>
    :root{--font-size-base:14px;--foreground:var(--ix-ink);--background:var(--ix-page);--muted-foreground:var(--ix-muted);--border:var(--ix-rule);--viz-series-1:var(--ix-blue);--viz-series-2:var(--ix-orange);--viz-series-3:var(--ix-green);accent-color:var(--ix-accent)}
    body{background:var(--background);color:var(--foreground);font:14px/1.5 system-ui,sans-serif;margin:0;padding:20px}
    h2,h3,p{margin:0}h2{font-size:20px}h3{font-size:15px}button,input,select{font:inherit;color:inherit}select,button{background:var(--background);border:1px solid var(--border);border-radius:5px;padding:7px;max-width:100%}button{cursor:pointer}input[type=range]{width:100%}
    .text-small{font-size:12px}.tabular-nums{font-variant-numeric:tabular-nums}.viz-row{display:flex;gap:12px;flex-wrap:wrap}.viz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}.card{background:color-mix(in srgb,currentColor 5%,transparent);border-radius:8px;padding:12px}.viz-stat-value{font-size:24px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.text-destructive{color:var(--viz-series-2)}.table-responsive{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border)}.text-end{text-align:right}
  </style>
</head>
