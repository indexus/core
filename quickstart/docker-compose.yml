# Indexus quickstart: one local node and optional on-demand vnodes with sample collections, read by Explore.
#
#   docker compose up            pull the published image and start
#   docker compose up --build    build from the sibling checkouts, then start
#   docker compose down          stop (add -v to drop the node's data)
#
# Then open http://localhost:5174/ (Chrome or Edge: WebGPU).
#
# Ports: only 5174 is published, on the host's loopback. Inside the
# container, on loopback: issuer 22030, node p2p 21031, monitoring 19031,
# gateway 3847 (the forwarder on 5174 passes to it).
#
# Linux arm64 build and startup validated locally on 17 Nov 2026.
# The public image and sample release are not published yet. See README.md.
name: indexus-quickstart

services:
  indexus:
    image: ghcr.io/indexus/quickstart:${INDEXUS_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      # The four repositories, siblings of core by default
      # (indexus/{core,sdk-js,dashboard,experiences}); override with INDEXUS_*.
      additional_contexts:
        core: ${INDEXUS_CORE:-..}
        sdk: ${INDEXUS_SDK:-../../sdk-js}
        dashboard: ${INDEXUS_DASHBOARD:-../../dashboard}
        experiences: ${INDEXUS_EXPERIENCES:-../../experiences}
      args:
        VERSION: ${INDEXUS_VERSION:-quickstart}
        SAMPLE_FILE: ${INDEXUS_SAMPLE_FILE:-indexus-sample-3d-cross-collection-v2.tar.xz}
        SAMPLE_URL: ${INDEXUS_SAMPLE_URL:-https://github.com/indexus/core/releases/download/sample-3d-cross-collection-v2/indexus-sample-3d-cross-collection-v2.tar.xz}
        SAMPLE_SHA256: ${INDEXUS_SAMPLE_SHA256:-de53f1c38734787c159df147070c10fddf0d2ce9d25e9088943a5f5d15e1f20d}
    ports:
      - "127.0.0.1:${INDEXUS_PORT:-5174}:5174"
    environment:
      INDEXUS_PORT: ${INDEXUS_PORT:-5174}
      # 1: the gateway refuses admin writes and hands out read tokens only.
      DEMO_MODE: "1"
      INDEXUS_MAX_VNODES: ${INDEXUS_MAX_VNODES:-1}
      INDEXUS_WRITES_PER_VNODE: ${INDEXUS_WRITES_PER_VNODE:-50}
      INDEXUS_ITEMS_PER_VNODE: ${INDEXUS_ITEMS_PER_VNODE:-1000000}
    volumes:
      - indexus-data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/ready && curl -fsS http://127.0.0.1:3847/api/health >/dev/null && curl -fsS http://127.0.0.1:19031/health >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 3
    stop_grace_period: 20s

volumes:
  indexus-data:
