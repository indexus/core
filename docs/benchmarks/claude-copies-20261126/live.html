  border-radius:8px;

}
.ix-dashboard figcaption {
  font-weight:600
}
.ix-dashboard svg {

.ix-dashboard svg text {

}

}

.ix-dashboard .resource>span:last-child {

}
.ix-dashboard .track {

  height:7px;
  position:relative
}

.ix-dashboard .track i {

}
.ix-dashboard .track .danger {

  font-size:12px;
  color:inherit;
  background:#8881;

  border-radius:5px;
  padding:5px 8px;
  cursor:pointer
}
.ix-dashboard button:focus-visible {

}
.ix-dashboard small {
  display:block
}
.ix-dashboard .stale {

.ix-dashboard .detail {

  display:block;
  font-size:12px
}
.ix-dashboard .alert {
  border-left:3px solid var(--series-2);
  padding:8px
