  border:1px solid var(--grid,#8885);
  padding:12px;
  border-radius:8px;
  min-width:0
}
.ix-dashboard figcaption {
  font-weight:600
}
.ix-dashboard svg {
  width:100%;
  display:block
}
.ix-dashboard svg text {
  fill:currentColor;

}
.ix-dashboard .gridline {

}

  flex-wrap:wrap;
  font-size:12px;
  min-height:20px

.ix-dashboard .fleet {

.ix-dashboard .hot {

  background:#c85c350b
}

  font-size:12px
}
.ix-dashboard .resource>span:last-child {
  text-align:right
}
.ix-dashboard .track {
  background:#8882;
  height:7px;
  position:relative
}
.ix-dashboard .track:after {

  height:11px;

  border-left:1px dashed currentColor
}
.ix-dashboard .track i {

}
.ix-dashboard .track .danger {

}
.ix-dashboard .vnodes {

  flex-wrap:wrap;
  gap:6px;
  margin-top:12px
}
.ix-dashboard button {
  font:inherit;
  font-size:12px;
  color:inherit;
  background:#8881;
  border:1px solid #8885;
  border-radius:5px;
  padding:5px 8px;
  cursor:pointer
}
.ix-dashboard button:focus-visible {
  outline:2px solid var(--series-1)
}
.ix-dashboard small {
  display:block
}
.ix-dashboard .stale {
  opacity:.55;
  border-style:dashed
}
.ix-dashboard .detail {
  overflow-wrap:anywhere;
  min-height:42px
}

  border-radius:5px;
  overflow-wrap:anywhere
}
.ix-dashboard .transfer span {
  display:block;
  font-size:12px
}
.ix-dashboard .alert {
  border-left:3px solid var(--series-2);
  padding:8px
}
